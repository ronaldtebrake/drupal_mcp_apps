body{margin:0;background:var(--background,#f4f7f5);color:var(--foreground,#263a30);font:12px/1.5 var(--font-body,var(--font-sans,system-ui,sans-serif))}
button,select{font:inherit;cursor:pointer}
button:disabled,select:disabled{cursor:wait;opacity:.6}
.activity-toolbar{display:flex;gap:10px;align-items:center;padding:12px 16px;background:var(--card,#fff);border-bottom:1px solid var(--border,#e5ebe7);flex-wrap:wrap}
.activity-toolbar strong{font-weight:650;font-size:12px;font-family:var(--font-sans,inherit)}
.activity-toolbar small{opacity:.65;font-size:10px;display:block}
.activity-filters{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.activity-period{display:flex;align-items:center;gap:6px;margin:0}
.activity-period input{width:62px}
.activity-period span{font-size:10px}
.activity-toolbar select,.activity-toolbar button,.activity-toolbar input{border:1px solid var(--border,#dfe6e1);background:var(--background,#fff);border-radius:var(--radius,7px);padding:6px 9px;color:inherit;font:inherit;font-size:10px}
.activity-toolbar select{width:auto}
.activity-status{font-size:10px;opacity:.8;padding:9px 16px;display:flex;gap:8px;justify-content:space-between}
.activity-status button{border:0;padding:0;background:none;color:inherit;font:inherit;cursor:pointer}
.activity-view iframe{display:block;width:100%;border:0;background:var(--background,#f4f7f5)}
.activity-error{margin:12px 16px;padding:12px;border-radius:var(--radius,8px);background:var(--muted,#fff2e9);color:var(--foreground,#8b5132);font-size:11px}
.activity-loading{padding:60px 24px;text-align:center;opacity:.7}
.activity-source{margin:0 16px 16px}
.activity-source summary{cursor:pointer;font-size:10px;opacity:.7}
.activity-source textarea{display:block;width:100%;height:260px;margin-top:8px;resize:vertical;background:var(--card,#fff);color:inherit;border:1px solid var(--border,#dee7e0);border-radius:var(--radius,8px);padding:14px;font:10px/1.5 var(--font-mono,ui-monospace,monospace)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--primary,#087d67);outline-offset:3px}
@media(max-width:500px){.activity-toolbar{gap:6px;padding:10px 12px}.activity-filters{gap:5px}.activity-status{font-size:9px}.activity-toolbar small{display:none}}
